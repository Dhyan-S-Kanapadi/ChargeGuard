[tool.poetry]
name = "chargeguard-ai"
version = "0.1.0"
description = "Autonomous chargeback dispute management for Indian merchants."
authors = ["ChargeGuard AI"]
readme = "README.md"
packages = [{ include = "core" }, { include = "agents" }, { include = "integrations" }, { include = "ml" }, { include = "documents" }, { include = "api" }, { include = "db" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
fastapi = "^0.115"
uvicorn = "^0.32"
pydantic = "^2.9"
reportlab = "^4.2"
scikit-learn = "^1.5"
neo4j = "^5.25"
httpx = "^0.27"
cryptography = "^46.0"
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
