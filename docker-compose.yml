services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
      CHARGEGUARD_STORE_PATH: "${CHARGEGUARD_STORE_PATH:-/var/data/chargeguard_store.json}"
      CHARGEGUARD_CREDENTIAL_STORE_PATH: "${CHARGEGUARD_CREDENTIAL_STORE_PATH:-/var/data/chargeguard_payment_credentials.json}"
    volumes:
      - chargeguard-data:/var/data

volumes:
  chargeguard-data:
