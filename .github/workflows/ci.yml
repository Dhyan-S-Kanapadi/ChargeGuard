name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: chargeguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chargeguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest -q
      - name: Real PostgreSQL persistence and concurrency tests
        env:
          CHARGEGUARD_TEST_DATABASE_URL: postgresql://postgres:ci-isolated-only@127.0.0.1:5432/chargeguard_test
        run: poetry run pytest -q tests/test_postgres_store.py tests/test_identity.py
      - name: Existing workflow regressions on PostgreSQL
        env:
          ENVIRONMENT: test
          CHARGEGUARD_STORE_BACKEND: postgres
          DATABASE_URL: postgresql://postgres:ci-isolated-only@127.0.0.1:5432/chargeguard_test
        run: >-
          poetry run pytest -q tests/test_api.py tests/test_payment_connectors.py
          tests/test_device_risk_connectors.py tests/test_razorpay_webhooks.py
          tests/test_razorpay_event_recovery.py tests/test_reason_classification.py
      - name: Validate Docker Compose configuration
        run: docker compose config
      - name: Build Docker image
        run: docker build -t chargeguard-ci .
      - name: Start Docker container
        run: |
          docker run -d \
            --name chargeguard-ci \
            -p 8000:8000 \
            -e PORT=8000 \
            -e ENVIRONMENT=staging \
            -e API_KEY=ci-test-api-key \
            -e RAZORPAY_WEBHOOK_SECRET=ci-test-webhook-secret \
            -e RAZORPAY_WEBHOOK_ENABLED=true \
            -e RAZORPAY_SIMULATOR_ENABLED=false \
            -e CHARGEGUARD_STORE_PATH=/tmp/chargeguard_store.json \
            -e CHARGEGUARD_USE_STUBS=true \
            chargeguard-ci
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              exit 0
            fi
            sleep 2
          done
          docker logs chargeguard-ci
          exit 1
      - name: Validate health response
        run: |
          python - <<'PY'
          import json

          with open("health.json", encoding="utf-8") as handle:
              health = json.load(handle)

          assert health["status"] == "ok", health
          assert health["model_loaded"] is True, health
          assert health["stub_mode"] is True, health
          PY
      - name: Stop Docker container
        if: always()
        run: docker rm -f chargeguard-ci || true
